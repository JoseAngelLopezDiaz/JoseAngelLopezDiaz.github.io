baseURL: https://joseangellopezdiaz.github.io
title: Señor Jose's website

enableRobotsTXT: true
enableGitInfo: true

taxonomies:
  tag: tags
  category: categories

pygmentsCodeFences: true
pygmentsUseClasses: false
pygmentsUseClassic: false
pygmentsStyle: tango

mediaTypes:
  text/redirects:
    delimiter: ''

outputFormats:
  redirects:
    baseName: _redirects
    isPlainText: true
    mediaType: text/redirects
    root: true

permalinks:
  blog: /:section/:year/:month/:day/:slugorcontentbasename

imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

contentDir: content
defaultContentLanguage: es
defaultContentLanguageInSubdir: false
enableMissingTranslationPlaceholders: false

languages:
  es:
    languageName: Español
    contentDir: content/es
    title: Señor Jose's website
    params:
      description: Web personal de José Ángel López Díaz

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    style: tango
    noClasses: false

outputs:
  home: [HTML, print, RSS, redirects]
  section: [HTML, print, RSS]

params:
  taxonomy:
    taxonomyCloud: []
    taxonomyCloudTitle: []
    taxonomyPageHeader: []

  privacy_policy: https://policies.google.com/privacy

  # Miniatura / imagen social principal
  images:
    - images/cara.jpg

  archived_version: false
  version: ""
  versionWithBuildId: ""

  github_repo: https://github.com/JoseAngelLopezDiaz/JoseAngelLopezDiaz.github.io
  github_project_repo: ""
  github_branch: main

  # Quita el buscador de arriba
  # Si quieres dejarlo, vuelve a poner tu gcs_engine_id
  offlineSearch: false

  prism_syntax_highlighting: false

  copyright:
    authors: >-
      José Ángel López Díaz
    from_year: 2026
    to_year: present

  ui:
    breadcrumb_disable: false
    navbar_logo: false
    navbar_translucent_over_cover_disable: false
    sidebar_menu_foldable: true
    sidebar_menu_compact: false
    sidebar_search_disable: true
    showLightDarkModeMenu: false

    feedback:
      enable: false

    readingtime:
      enable: false

  btn-lg: class="btn btn-lg btn-{1}" role="button"
  FA: <i class="fa-{1} fa-{2} text-{3} px-1"></i>

  links:
    user: []
    developer: []

security:
  funcs:
    getenv:
      - ^(BRANCH|BUILD_ID|COMMIT_REF|CONTEXT|DEPLOY_ID|NETLIFY|PULL_REQUEST|REVIEW_ID)$

module:
  hugoVersion:
    extended: true
    min: 0.155.0
  imports:
    - path: github.com/google/docsy
      disable: false
