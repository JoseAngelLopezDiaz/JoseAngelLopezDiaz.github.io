baseURL: "https://joseangellopezdiaz.github.io/"
title: "José Ángel López Díaz"

contentDir: "content/es"
defaultContentLanguage: "es"
defaultContentLanguageInSubdir: false
enableMissingTranslationPlaceholders: false
enableRobotsTXT: true
enableGitInfo: true

taxonomies:
  tag: tags
  category: categories

permalinks:
  blog: "/:section/:year/:month/:day/:slugorcontentbasename/"

imaging:
  resampleFilter: "CatmullRom"
  quality: 85
  anchor: "smart"

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    style: "tango"
    noClasses: false

mediaTypes:
  text/redirects:
    delimiter: ""

outputFormats:
  redirects:
    baseName: "_redirects"
    isPlainText: true
    mediaType: "text/redirects"
    root: true

outputs:
  home:
    - HTML
    - RSS
    - redirects
  section:
    - HTML
    - RSS

languages:
  es:
    languageName: "Español"
    languageCode: "es-ES"
    contentDir: "content/es"
    title: "José Ángel López Díaz"
    weight: 1
    params:
      description: "Página personal de José Ángel López Díaz"

params:
  description: "Página personal de José Ángel López Díaz"
  images:
    - "images/cara.jpg"

  privacy_policy: "https://policies.google.com/privacy"

  github_repo: "https://github.com/JoseAngelLopezDiaz/JoseAngelLopezDiaz.github.io"
  github_branch: "main"
  github_project_repo: ""

  offlineSearch: false
  prism_syntax_highlighting: false

  copyright:
    authors: "José Ángel López Díaz"
    from_year: 2026
    to_year: "present"

  taxonomy:
    taxonomyCloud:
      - tags
      - categories
    taxonomyCloudTitle:
      - "Etiquetas"
      - "Categorías"
    taxonomyPageHeader:
      - tags
      - categories

  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: true
    sidebar_menu_foldable: true
    sidebar_menu_compact: false
    sidebar_search_disable: true
    showLightDarkModeMenu: true

    feedback:
      enable: false

    readingtime:
      enable: false

  links:
    user:
      - name: "LinkedIn"
        url: "https://es.linkedin.com/in/jos%C3%A9%C3%A1ngell%C3%B3pezd%C3%ADaz"
        icon: "fab fa-linkedin"
        desc: "Perfil de LinkedIn"
      - name: "GitHub"
        url: "https://github.com/JoseAngelLopezDiaz"
        icon: "fab fa-github"
        desc: "Perfil de GitHub"
    developer: []

security:
  funcs:
    getenv:
      - "^(BRANCH|BUILD_ID|COMMIT_REF|CONTEXT|DEPLOY_ID|NETLIFY|PULL_REQUEST|REVIEW_ID)$"

module:
  hugoVersion:
    extended: true
    min: "0.155.0"
  imports:
    - path: "github.com/google/docsy"
      disable: false
